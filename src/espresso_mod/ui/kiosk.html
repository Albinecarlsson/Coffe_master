<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="theme-color" content="#120e0b" />
    <title>Brio · Coffee</title>
    <style>
      :root {
        /* Espresso browns, crema and cream: this is an appliance, not a dashboard. */
        --bg: #120e0b;
        --text: #f4ece3;
        --muted: #bda895;
        --faint: rgba(244, 236, 227, 0.1);
        --accent: #e8b071;
        --accent-deep: #c9803c;
        --danger: #e8695c;
        --ok: #7cc48c;
        --warn: #e8b071;
        --border: rgba(255, 240, 220, 0.09);
        --shadow: 0 14px 34px rgba(0, 0, 0, 0.42);
        --radius: 22px;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(75% 55% at 22% -8%, rgba(232, 176, 113, 0.14), transparent 70%),
          radial-gradient(60% 45% at 100% 0%, rgba(201, 128, 60, 0.08), transparent 70%),
          var(--bg);
        color: var(--text);
        touch-action: manipulation;
        user-select: none;
      }

      /* ---- header ---- */

      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 26px;
        border-bottom: 1px solid var(--border);
        background: rgba(18, 14, 11, 0.82);
        backdrop-filter: blur(14px);
      }
      .brand { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
      .wordmark {
        font-family: var(--serif);
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .clock {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .status { display: flex; align-items: center; gap: 14px; min-width: 0; }

      .ring-wrap { position: relative; width: 64px; height: 64px; flex: none; }
      .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring circle { fill: none; stroke-width: 4; }
      .ring .track { stroke: rgba(255, 255, 255, 0.08); }
      .ring .fill {
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-dasharray: 113.1;
        stroke-dashoffset: 113.1;
        transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;
      }
      .ring.ok .fill { stroke: var(--ok); }
      .ring.bad .fill { stroke: var(--danger); }
      .ring-label {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .ring-label #tempC {
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .ring-label .unit { font-size: 9px; color: var(--muted); margin-top: 2px; }

      .status-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

      .pill {
        display: inline-block;
        align-self: flex-start;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.25);
        font-size: 13px;
        font-weight: 650;
        color: var(--muted);
        white-space: nowrap;
      }
      .pill.ok { color: var(--ok); border-color: rgba(124, 196, 140, 0.4); }
      .pill.warn { color: var(--warn); border-color: rgba(232, 176, 113, 0.4); }
      .pill.bad { color: var(--danger); border-color: rgba(232, 105, 92, 0.45); }
      .status-sub {
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        max-width: 230px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .link {
        color: var(--muted);
        text-decoration: none;
        font-size: 12px;
        padding: 6px 2px;
        border-bottom: 1px solid transparent;
        white-space: nowrap;
      }
      .link:hover { color: var(--text); border-bottom-color: var(--faint); }

      /* ---- main ---- */

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 26px 8px;
      }

      .hero { margin-bottom: 20px; }
      .eyebrow {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }
      .hero h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(28px, 3.4vw, 46px);
        letter-spacing: -0.01em;
      }

      .drinks {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .drink {
        appearance: none;
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto 1fr auto;
        gap: 6px 12px;
        align-items: start;
        min-height: clamp(150px, 21vh, 200px);
        padding: 18px 20px;
        text-align: left;
        cursor: pointer;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: linear-gradient(165deg, #241b14 0%, #1a1310 78%);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: transform 0.12s ease, border-color 0.18s ease, box-shadow 0.18s ease,
          opacity 0.18s ease;
      }
      .drink::after {
        /* warm sheen that appears on press */
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(120% 90% at 80% 0%, rgba(232, 176, 113, 0.18), transparent 60%);
        opacity: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
      }
      @media (hover: hover) {
        .drink:hover { transform: translateY(-2px); border-color: rgba(232, 176, 113, 0.4); }
        .drink:hover::after { opacity: 1; }
      }
      .drink:active { transform: scale(0.985); border-color: var(--accent); }
      .drink:active::after { opacity: 1; }
      .drink:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .drink[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
      .drink[disabled]::after { opacity: 0; }

      .drink .name {
        grid-column: 1;
        grid-row: 1;
        font-family: var(--serif);
        font-size: 23px;
        font-weight: 500;
        letter-spacing: 0.005em;
      }
      .drink .cup-slot { grid-column: 2; grid-row: 1 / span 2; opacity: 0.92; }
      .drink .desc {
        grid-column: 1;
        grid-row: 2;
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--muted);
        padding-right: 6px;
      }
      .drink .meta {
        grid-column: 1 / span 2;
        grid-row: 3;
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 10px;
      }
      .chip {
        font-size: 11.5px;
        font-weight: 650;
        letter-spacing: 0.02em;
        color: var(--accent);
        background: rgba(232, 176, 113, 0.1);
        border: 1px solid rgba(232, 176, 113, 0.16);
        padding: 4px 9px;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      .chip.quiet {
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border);
      }

      /* ---- cup drawing ---- */

      .cup { width: 54px; height: 54px; display: block; color: var(--muted); }
      .cup .body,
      .cup .handle { fill: none; stroke: currentColor; stroke-width: 2.2; }
      .cup .handle { opacity: 0.75; }
      .cup .rim { stroke: currentColor; stroke-width: 2.2; opacity: 0.5; stroke-linecap: round; }
      .cup .liquid {
        fill: var(--accent);
        opacity: 0.9;
        transform: translateY(40px);
        transition: transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      .drink:hover .cup { color: var(--accent); }

      /* ---- recent ---- */

      .recent-block { margin-top: 34px; padding-top: 0; }
      .section {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .recent { display: flex; flex-wrap: wrap; gap: 10px; min-height: 42px; }
      .hist {
        display: flex;
        align-items: baseline;
        gap: 9px;
        padding: 9px 15px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        font-size: 13px;
      }
      .hist .n { font-weight: 650; }
      .hist .d { color: var(--muted); font-variant-numeric: tabular-nums; }
      .hist.bad { border-color: rgba(232, 105, 92, 0.4); }
      .hist.bad .d { color: var(--danger); }

      .foot {
        flex: none;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 12px 26px 16px;
        font-size: 11px;
        color: var(--muted);
      }
      .foot .note { opacity: 0.7; }
      .foot .spec { letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
      .empty { color: var(--muted); font-size: 13px; }

      /* ---- pour overlay ---- */

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(9, 6, 4, 0.72);
        backdrop-filter: blur(7px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.22s ease, visibility 0.22s;
      }
      .overlay.show { opacity: 1; visibility: visible; }

      .pour-card {
        width: min(460px, 100%);
        padding: 26px 28px 22px;
        border: 1px solid var(--border);
        border-radius: 26px;
        background: linear-gradient(170deg, #241b14, #17110d);
        box-shadow: 0 26px 60px rgba(0, 0, 0, 0.55);
        transform: translateY(12px) scale(0.99);
        transition: transform 0.22s ease;
      }
      .overlay.show .pour-card { transform: none; }

      .pour-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .pour-name { font-family: var(--serif); font-size: 27px; font-weight: 500; }
      .pour-state {
        margin-top: 3px;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
      }
      .pour-state.done { color: var(--ok); }
      .pour-state.stopped { color: var(--danger); }
      .pour-cup .cup { width: 72px; height: 72px; color: var(--accent); }

      .pour-numbers {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin: 18px 0 10px;
      }
      .big-num {
        font-size: 46px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .pour-numbers .of { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

      .track {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .track > div {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent-deep), var(--accent));
        transition: width 0.2s linear;
      }

      /* Brew pressure: the screen is replacing the mechanical gauge, so this is
         the instrument during a shot, not a decoration. */
      .pressure-block { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
      .pressure-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
      }
      .pressure-label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .pressure-reading {
        font-size: 21px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .pressure-reading .unit { font-size: 12px; font-weight: 600; color: var(--muted); }
      .pressure-track {
        position: relative;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .pressure-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent-deep), var(--accent));
        transition: width 0.18s linear, background 0.2s ease;
      }
      .pressure-fill.hot { background: linear-gradient(90deg, var(--accent), var(--danger)); }
      .pressure-mark {
        position: absolute;
        left: 56.25%; /* 9 bar of 16 */
        top: -3px;
        bottom: -3px;
        width: 2px;
        border-radius: 2px;
        background: rgba(244, 236, 227, 0.8);
        pointer-events: none;
      }
      .pressure-scale {
        display: flex;
        justify-content: space-between;
        margin-top: 5px;
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .pour-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 16px;
      }
      .pour-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

      button.action {
        appearance: none;
        cursor: pointer;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 14px;
        padding: 13px 24px;
        font-size: 15px;
        font-weight: 700;
        touch-action: manipulation;
      }
      button.action:active { transform: scale(0.97); }
      button.action.danger {
        background: rgba(232, 105, 92, 0.16);
        border-color: rgba(232, 105, 92, 0.45);
        color: var(--danger);
      }

      /* ---- toast ---- */

      .toast {
        position: fixed;
        left: 50%;
        top: 18px;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 12px;
        transform: translate(-50%, -190%);
        padding: 13px 18px;
        border-radius: 16px;
        border: 1px solid rgba(232, 176, 113, 0.35);
        background: #241a13;
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        box-shadow: var(--shadow);
        transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
        max-width: min(560px, 92vw);
      }
      .toast.show { transform: translate(-50%, 0); }
      .toast .retry {
        flex: none;
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #1d130a;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
      }

      /* ---- attract (idle) ---- */

      .attract {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: grid;
        place-items: center;
        padding: 32px;
        overflow: hidden;
        background:
          radial-gradient(70% 55% at 50% 16%, rgba(232, 176, 113, 0.16), transparent 70%),
          radial-gradient(60% 50% at 50% 112%, rgba(201, 128, 60, 0.1), transparent 70%),
          #0d0a08;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        cursor: pointer;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      .attract.show { opacity: 1; visibility: visible; pointer-events: auto; }

      .attract-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: clamp(8px, 1.8vh, 20px);
      }
      .attract-mark {
        font-family: var(--serif);
        font-size: 14px;
        letter-spacing: 0.5em;
        padding-left: 0.5em; /* balance the trailing letter-space */
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.85;
      }
      .attract-clock {
        font-family: var(--serif);
        font-size: clamp(76px, 15vw, 168px);
        font-weight: 400;
        line-height: 0.96;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 12px 60px rgba(232, 176, 113, 0.18);
      }
      .attract-date {
        font-size: clamp(11px, 1.4vw, 14px);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* A drawn cup with slow wisps of steam: the only motion on an idle screen. */
      .attract-cup { position: relative; width: 110px; height: 76px; margin-top: 2px; }
      .attract-cup #attractCup { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
      .attract-cup .cup { width: 60px; height: 60px; color: var(--muted); opacity: 0.8; }
      .wisp {
        position: absolute;
        bottom: 52px;
        left: 50%;
        width: 6px;
        height: 32px;
        margin-left: -3px;
        border-radius: 999px;
        background: linear-gradient(to top, rgba(244, 236, 227, 0), rgba(244, 236, 227, 0.4));
        filter: blur(2px);
        opacity: 0;
      }
      /* Animate only while the idle view is on screen: nothing spins in the
         background the rest of the day. */
      .attract.show .wisp { animation: wisp-rise 5.4s ease-in-out infinite; }
      /* Negative delays: the steam is already rising the moment the view appears. */
      .wisp.w1 { animation-delay: -0.6s; }
      .wisp.w2 { left: 57%; height: 42px; animation-delay: -2.1s; }
      .wisp.w3 { left: 43%; height: 26px; animation-delay: -3.9s; }
      @keyframes wisp-rise {
        0% { opacity: 0; transform: translateY(10px) scale(0.8) rotate(0deg); }
        30% { opacity: 0.85; }
        100% { opacity: 0; transform: translateY(-30px) scale(1.2) rotate(7deg); }
      }

      .attract-temp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: clamp(4px, 1.5vh, 18px);
      }
      .attract-ring-wrap { position: relative; width: clamp(104px, 15vh, 132px); height: clamp(104px, 15vh, 132px); }
      .attract-ring { width: 100%; height: 100%; transform: rotate(-90deg); }
      .attract-ring circle { fill: none; stroke-width: 2.5; }
      .attract-ring .track { stroke: rgba(255, 255, 255, 0.07); }
      .attract-ring .fill {
        stroke: var(--accent);
        stroke-linecap: round;
        stroke-dasharray: 113.1;
        stroke-dashoffset: 113.1;
        transition: stroke-dashoffset 1.2s ease, stroke 0.6s ease;
      }
      .attract.show .attract-ring .fill { animation: ring-breathe 7s ease-in-out infinite; }
      .attract-ring.ok .fill { stroke: var(--ok); }
      .attract-ring.bad .fill { stroke: var(--danger); }
      @keyframes ring-breathe {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      .attract-ring-label {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        line-height: 1;
      }
      .attract-ring-label #attractTemp {
        font-size: clamp(23px, 3vw, 30px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .attract-ring-label .unit { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
      .attract-status { min-height: 1.4em; font-size: clamp(13px, 1.6vw, 16px); color: var(--muted); }
      .attract-status.ok { color: var(--ok); }
      .attract-status.warn { color: var(--warn); }
      .attract-status.bad { color: var(--danger); }
      .attract-hint {
        margin-top: clamp(16px, 4vh, 42px);
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
        opacity: 0.6;
      }
      .attract.show .attract-hint { animation: hint-breathe 3.8s ease-in-out infinite; }
      @keyframes hint-breathe {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }

      /* ---- small screens ---- */

      @media (max-width: 1000px) {
        .drinks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        main { padding: 16px 18px 8px; }
        header { padding: 12px 18px; }
        .hero { margin-bottom: 14px; }
      }
      @media (max-width: 560px) {
        .drinks { grid-template-columns: 1fr; }
        .brand .clock { display: none; }
        .status .link { display: none; }
        .foot .note { display: none; }
        .attract-cup { display: none; }
      }
      @media (max-height: 560px) {
        .hero h1 { font-size: 24px; }
        .drink { min-height: 138px; padding: 14px 16px; }
        .cup { width: 44px; height: 44px; }
        .ring-wrap { width: 54px; height: 54px; }
        .recent-block { padding-top: 18px; }
        .attract { padding: 18px; }
        .attract-clock { font-size: 64px; }
        .attract-cup { display: none; }
        .attract-ring-wrap { width: 92px; height: 92px; }
        .attract-inner { gap: 6px; }
        .attract-hint { margin-top: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <span class="wordmark">Brio</span>
        <span id="clock" class="clock">--:--</span>
      </div>
      <div class="status">
        <div class="ring-wrap">
          <svg id="tempRing" class="ring" viewBox="0 0 44 44" aria-hidden="true">
            <circle class="track" cx="22" cy="22" r="18" />
            <circle id="ringFill" class="fill" cx="22" cy="22" r="18" />
          </svg>
          <div class="ring-label">
            <span id="tempC">--</span>
            <span class="unit">°C</span>
          </div>
        </div>
        <div class="status-text">
          <span id="readyPill" class="pill" role="status">--</span>
          <span id="statusSub" class="status-sub"></span>
        </div>
        <a class="link" href="/">Engineer view</a>
      </div>
    </header>

    <main>
      <div class="hero">
        <p id="greeting" class="eyebrow">Welcome</p>
        <h1>What are you having?</h1>
      </div>

      <div id="drinks" class="drinks"></div>

      <section class="recent-block">
        <h2 class="section">Recently poured</h2>
        <div id="recent" class="recent"></div>
      </section>
    </main>

    <div class="foot">
      <span id="drinksHint" class="note"></span>
      <span class="spec">Isomac Brio · 0.2 L boiler · 3.5 L tank</span>
    </div>

    <div id="attract" class="attract" aria-hidden="true">
      <div class="attract-inner">
        <div class="attract-mark">Brio</div>
        <div id="attractClock" class="attract-clock">--:--</div>
        <div id="attractDate" class="attract-date"></div>

        <div class="attract-cup" aria-hidden="true">
          <span class="wisp w1"></span>
          <span class="wisp w2"></span>
          <span class="wisp w3"></span>
          <div id="attractCup"></div>
        </div>

        <div class="attract-temp">
          <div class="attract-ring-wrap">
            <svg id="attractRing" class="attract-ring" viewBox="0 0 44 44" aria-hidden="true">
              <circle class="track" cx="22" cy="22" r="18" />
              <circle id="attractRingFill" class="fill" cx="22" cy="22" r="18" />
            </svg>
            <div class="attract-ring-label">
              <span id="attractTemp">--</span>
              <span class="unit">°C</span>
            </div>
          </div>
          <div id="attractStatus" class="attract-status"></div>
        </div>

        <div class="attract-hint">Tap anywhere to start</div>
      </div>
    </div>

    <div id="pourOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Pour in progress">
      <div class="pour-card">
        <div class="pour-top">
          <div>
            <div id="pourName" class="pour-name">Pour</div>
            <div id="pourState" class="pour-state">Brewing</div>
          </div>
          <div id="pourCup" class="pour-cup"></div>
        </div>

        <div class="pour-numbers">
          <span id="pourMl" class="big-num">0.0</span>
          <span class="of">/ <span id="pourTarget">0</span> ml</span>
        </div>
        <div class="track"><div id="pourProgress"></div></div>

        <div class="pressure-block">
          <div class="pressure-head">
            <span class="pressure-label">Pressure</span>
            <span class="pressure-reading">
              <span id="pourBar">--</span><span class="unit"> bar</span>
            </span>
          </div>
          <div class="pressure-track">
            <div id="pourBarFill" class="pressure-fill"></div>
            <div class="pressure-mark"></div>
          </div>
          <div class="pressure-scale"><span>0</span><span>8</span><span>16</span></div>
        </div>

        <div class="pour-foot">
          <span id="pourTime" class="pour-time">0.0 s</span>
          <button id="btnCancel" class="action danger" type="button">Stop</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
      const API_BASE = window.location.origin;
      const el = (id) => document.getElementById(id);
      const RING_LEN = 113.1;
      const CUP_PATH = "M13 17h38l-4.3 36.6A7 7 0 0 1 39.8 60H24.2a7 7 0 0 1-6.9-6.4L13 17Z";

      let drinks = [];
      let pourState = "idle";
      let overlayHideAt = 0;
      let busy = false;

      // Idle screen: after a minute without a touch, turn into a clock.
      const ATTRACT_AFTER_MS = 60_000;
      let lastInteractionAt = Date.now();

      // ---- helpers ----

      async function apiGet(path) {
        const r = await fetch(`${API_BASE}${path}`);
        if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
        return r.json();
      }

      async function apiPost(path) {
        const r = await fetch(`${API_BASE}${path}`, { method: "POST" });
        const text = await r.text();
        let body = null;
        try { body = text ? JSON.parse(text) : null; } catch { body = { detail: text }; }
        if (!r.ok) {
          const err = new Error((body && body.detail) || `${r.status}`);
          err.status = r.status;
          throw err;
        }
        return body;
      }

      function cupMarkup(id, extraClass = "") {
        return `<svg class="cup ${extraClass}" viewBox="0 0 64 64" aria-hidden="true">
          <defs><clipPath id="${id}"><path d="${CUP_PATH}"/></clipPath></defs>
          <path class="handle" d="M50 24h3.6a8 8 0 0 1 0 16H48.6"/>
          <g clip-path="url(#${id})"><rect class="liquid" x="9" y="22" width="46" height="42"/></g>
          <path class="body" d="${CUP_PATH}"/>
          <path class="rim" d="M11.4 17h41.2"/>
        </svg>`;
      }

      function setCupLevel(container, pct) {
        const liquid = container.querySelector(".liquid");
        if (!liquid) return;
        const clamped = Math.max(0, Math.min(1, pct));
        liquid.style.transform = `translateY(${((1 - clamped) * 40).toFixed(2)}px)`;
      }

      function setRing(pct, tone) {
        const ring = el("tempRing");
        ring.classList.remove("ok", "warn", "bad");
        ring.classList.add(tone);
        const clamped = Math.max(0, Math.min(1, pct));
        el("ringFill").style.strokeDashoffset = String(RING_LEN * (1 - clamped));
      }

      function setAttract(show) {
        const node = el("attract");
        if (node.classList.contains("show") === show) return;
        node.classList.toggle("show", show);
        node.setAttribute("aria-hidden", show ? "false" : "true");
      }

      function noteInteraction() {
        lastInteractionAt = Date.now();
        setAttract(false);
      }

      function attractDue() {
        return Date.now() - lastInteractionAt >= ATTRACT_AFTER_MS;
      }

      function renderAttract(status) {
        const now = new Date();
        el("attractClock").textContent =
          now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        el("attractDate").textContent =
          now.toLocaleDateString([], { weekday: "long", day: "numeric", month: "long" });

        const ring = el("attractRing");
        const fill = el("attractRingFill");
        const line = el("attractStatus");
        ring.classList.remove("ok", "warn", "bad");
        line.className = "attract-status";
        el("attractTemp").textContent = status.temp_ok ? status.temp_c.toFixed(1) : "--";

        if (status.control_error) {
          line.textContent = "Control fault";
          line.classList.add("bad");
          ring.classList.add("bad");
          fill.style.strokeDashoffset = "0";
        } else if (!status.temp_ok) {
          line.textContent = status.temp_fault || "No temperature reading";
          line.classList.add("bad");
          ring.classList.add("bad");
          fill.style.strokeDashoffset = String(RING_LEN);
        } else if (status.ready) {
          line.textContent = `Ready at ${status.setpoint_c.toFixed(0)} °C`;
          line.classList.add("ok");
          ring.classList.add("ok");
          fill.style.strokeDashoffset = "0";
        } else {
          const delta = status.setpoint_c - status.temp_c;
          line.textContent =
            `Warming · ${delta > 0 ? "+" : ""}${delta.toFixed(1)} °C to go`;
          line.classList.add("warn");
          ring.classList.add("warn");
          const span = Math.max(1, status.setpoint_c - 20);
          const pct = Math.max(0, Math.min(1, (status.temp_c - 20) / span));
          fill.style.strokeDashoffset = String(RING_LEN * (1 - pct));
        }
      }

      function clockAndGreeting() {
        const now = new Date();
        el("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        const h = now.getHours();
        el("greeting").textContent =
          h < 5 ? "Late shift" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      }

      function relativeTime(epochSeconds) {
        const seconds = Math.max(0, Date.now() / 1000 - epochSeconds);
        if (seconds < 60) return "just now";
        if (seconds < 3600) return `${Math.round(seconds / 60)} min ago`;
        if (seconds < 86400) return `${Math.round(seconds / 3600)} h ago`;
        return `${Math.round(seconds / 86400)} d ago`;
      }

      function showToast(message, retry) {
        const t = el("toast");
        t.textContent = message;
        if (retry) {
          const b = document.createElement("button");
          b.className = "retry";
          b.type = "button";
          b.textContent = "Pour anyway";
          b.onclick = () => { hideToast(); retry(); };
          t.appendChild(b);
        }
        t.classList.add("show");
        clearTimeout(showToast._timer);
        if (!retry) showToast._timer = setTimeout(hideToast, 4500);
      }
      function hideToast() { el("toast").classList.remove("show"); }

      // ---- drinks ----

      async function loadDrinks() {
        const body = await apiGet("/drinks");
        drinks = body.drinks;
        const wrap = el("drinks");
        wrap.innerHTML = "";
        if (!drinks.length) {
          el("drinksHint").textContent = "No drinks configured.";
          return;
        }
        el("drinksHint").textContent =
          `Dosing is time based at ${body.brew_flow_ml_s.toFixed(2)} ml/s · ` +
          "calibrate BREW_FLOW_ML_S against a scale.";

        for (const d of drinks) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "drink";
          b.dataset.key = d.key;
          b.innerHTML = `
            <div class="name"></div>
            <div class="cup-slot">${cupMarkup(`cup-${d.key}`)}</div>
            <div class="desc"></div>
            <div class="meta">
              <span class="chip">${d.water_ml.toFixed(0)} ml</span>
              <span class="chip quiet">${d.setpoint_c.toFixed(0)} °C</span>
            </div>`;
          b.querySelector(".name").textContent = d.name;
          b.querySelector(".desc").textContent = d.description;
          b.onclick = () => pour(d.key, false);
          wrap.appendChild(b);
        }

        // fill the cups once they are in the DOM, so they animate up to level
        requestAnimationFrame(() => {
          for (const b of wrap.querySelectorAll(".drink")) {
            const drink = drinks.find((d) => d.key === b.dataset.key);
            if (drink) setCupLevel(b.querySelector(".cup-slot"), Math.min(1, drink.water_ml / 60));
          }
        });
      }

      async function pour(key, force) {
        if (busy) return;
        busy = true;
        try {
          await apiPost(`/drinks/pour/${encodeURIComponent(key)}${force ? "?force=true" : ""}`);
          hideToast();
        } catch (e) {
          if (e.status === 409 && !force && /not at/i.test(e.message)) {
            showToast(e.message, () => pour(key, true));
          } else {
            showToast(e.message);
          }
        } finally {
          busy = false;
          refresh();
        }
      }

      async function cancel() {
        try { await apiPost("/drinks/cancel"); } catch (e) { showToast(e.message); }
        refresh();
      }

      // ---- history ----

      async function loadHistory() {
        let body;
        try { body = await apiGet("/history?limit=6"); } catch { return; }
        const wrap = el("recent");
        wrap.innerHTML = "";
        if (!body.entries.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "Nothing poured yet — pick something above.";
          wrap.appendChild(empty);
          return;
        }
        for (const e of body.entries) {
          const chip = document.createElement("div");
          chip.className = "hist" + (e.state === "error" ? " bad" : "");
          const name = document.createElement("span");
          name.className = "n";
          const found = drinks.find((d) => d.key === e.name);
          name.textContent = found ? found.name : e.name;
          const detail = document.createElement("span");
          detail.className = "d";
          const amount = e.delivered_ml != null
            ? `${e.delivered_ml.toFixed(0)} ml`
            : `${e.elapsed_s.toFixed(0)} s`;
          const peak = e.peak_bar != null ? ` · ${e.peak_bar.toFixed(1)} bar` : "";
          const outcome = e.state === "done" ? "" : ` · ${e.state}`;
          detail.textContent = `${amount}${peak}${outcome} · ${relativeTime(e.finished_at)}`;
          chip.append(name, detail);
          wrap.appendChild(chip);
        }
      }

      // ---- rendering ----

      function renderReady(status) {
        el("tempC").textContent = status.temp_ok ? status.temp_c.toFixed(1) : "--";
        const pill = el("readyPill");
        const sub = el("statusSub");
        pill.className = "pill";
        pill.title = "";

        if (status.control_error) {
          pill.textContent = "Control fault";
          pill.classList.add("bad");
          pill.title = status.control_error;
          sub.textContent = status.control_error;
          setRing(1, "bad");
        } else if (!status.temp_ok) {
          pill.textContent = "Sensor fault";
          pill.classList.add("bad");
          sub.textContent = status.temp_fault || "No reading";
          setRing(0, "bad");
        } else if (status.ready) {
          pill.textContent = "Ready";
          pill.classList.add("ok");
          sub.textContent = `${status.setpoint_c.toFixed(0)} °C and holding`;
          setRing(1, "ok");
        } else {
          const delta = status.setpoint_c - status.temp_c;
          pill.textContent = "Warming";
          pill.classList.add("warn");
          sub.textContent = `${delta > 0 ? "+" : ""}${delta.toFixed(1)} °C to go`;
          const span = Math.max(1, status.setpoint_c - 20);
          setRing((status.temp_c - 20) / span, "warn");
        }

        const canPour = status.temp_ok && status.pour.state !== "pouring";
        for (const b of document.querySelectorAll(".drink")) b.disabled = !canPour;
      }

      function fillPourCard(pour, label, tone, status) {
        const drink = drinks.find((d) => d.key === pour.drink);
        el("pourName").textContent = drink ? drink.name : pour.drink || "Pour";
        el("pourState").textContent = label;
        el("pourState").className = `pour-state ${tone}`;
        el("pourMl").textContent = pour.delivered_ml.toFixed(1);
        el("pourTarget").textContent = pour.target_ml.toFixed(0);
        el("pourTime").textContent = `${pour.elapsed_s.toFixed(1)} s`;

        const pct = pour.target_ml > 0
          ? Math.max(0, Math.min(1, pour.delivered_ml / pour.target_ml))
          : 0;
        el("pourProgress").style.width = `${(pct * 100).toFixed(1)}%`;
        setCupLevel(el("pourCup"), pct);

        // The screen replaces the mechanical gauge, so pressure gets a real
        // readout here: 0-16 bar with a mark at the usual 9 bar target.
        const bar = status && status.pressure_ok ? status.pressure_bar : null;
        const barPct = bar == null ? 0 : Math.max(0, Math.min(1, bar / 16));
        el("pourBar").textContent = bar == null ? "--" : bar.toFixed(1);
        el("pourBarFill").style.width = `${(barPct * 100).toFixed(1)}%`;
        el("pourBarFill").classList.toggle("hot", bar != null && bar > 13);
      }

      function renderPour(status) {
        const pour = status.pour;
        const prev = pourState;
        pourState = pour.state;
        const overlay = el("pourOverlay");

        if (pour.state === "pouring") {
          overlayHideAt = 0;
          fillPourCard(pour, "Brewing", "live", status);
          el("btnCancel").style.display = "";
          overlay.classList.add("show");
          return;
        }

        if (prev === "pouring") {
          // just finished: show the result for a moment, then get out of the way
          overlayHideAt = Date.now() + (pour.state === "done" ? 2600 : 4200);
          const label = pour.state === "done" ? "Done" : pour.state === "canceled" ? "Stopped" : "Error";
          fillPourCard(pour, label, pour.state === "done" ? "done" : "stopped", status);
          el("btnCancel").style.display = "none";
          overlay.classList.add("show");
          loadHistory();
          return;
        }

        if (overlayHideAt && Date.now() < overlayHideAt) {
          fillPourCard(pour, el("pourState").textContent, pour.state === "done" ? "done" : "stopped", status);
          return;
        }

        overlayHideAt = 0;
        overlay.classList.remove("show");
      }

      // ---- loop ----

      async function refresh() {
        try {
          const status = await apiGet("/kiosk/status");
          renderReady(status);
          renderPour(status);

          // Attract only when the screen is calm: no pour card, no fault. A
          // hidden problem must stay visible, so a fault cancels the idle view.
          const overlayShown = el("pourOverlay").classList.contains("show");
          const calm = !overlayShown && !status.control_error && status.temp_ok;
          if (attractDue() && calm) {
            renderAttract(status);
            setAttract(true);
          } else {
            setAttract(false);
          }
        } catch (e) {
          setAttract(false);
          el("readyPill").className = "pill bad";
          el("readyPill").textContent = "Offline";
          el("statusSub").textContent = "Retrying…";
          setRing(0, "bad");
        }
      }

      async function loop() {
        await refresh();
        // poll faster while the cup is filling so the numbers and bar move smoothly
        setTimeout(loop, pourState === "pouring" ? 200 : 1000);
      }

      el("btnCancel").onclick = cancel;
      el("pourCup").innerHTML = cupMarkup("cup-pour");
      setCupLevel(el("pourCup"), 0);
      el("attractCup").innerHTML = cupMarkup("cup-attract");
      setCupLevel(el("attractCup"), 0);

      // Any touch, key or scroll wakes the screen and restarts the idle timer.
      document.addEventListener("pointerdown", noteInteraction, { passive: true });
      document.addEventListener("keydown", noteInteraction);
      document.addEventListener("wheel", noteInteraction, { passive: true });

      clockAndGreeting();
      setInterval(clockAndGreeting, 5000);
      setInterval(loadHistory, 15000);

      (async function main() {
        await loadDrinks().catch((e) => showToast(`Could not load drinks: ${e.message}`));
        loadHistory();
        loop();
      })();
    </script>
  </body>
</html>
